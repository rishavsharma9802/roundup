<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Roundup">
  <title>Roundup</title>

  <!-- Store master. The rim is drawn inside the artwork box so the outer edge
       lands exactly on 16px, preserving the transparent padding the Chrome Web
       Store expects on a 128x128 store icon. -->
  <rect x="18.5" y="18.5" width="91" height="91" rx="24" fill="#0f1a24" stroke="#2dd4bf" stroke-width="5"/>

  <rect x="34" y="34" width="10" height="60" rx="5" fill="#ffffff"/>
  <rect x="34" y="34" width="23" height="10" rx="5" fill="#ffffff"/>
  <rect x="34" y="84" width="23" height="10" rx="5" fill="#ffffff"/>

  <rect x="52" y="48" width="42" height="12" rx="6" fill="#2dd4bf"/>
  <rect x="52" y="68" width="29" height="12" rx="6" fill="#38bdf8"/>
</svg>
